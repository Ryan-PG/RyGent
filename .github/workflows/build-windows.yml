name: Build Windows

# Called by the Release workflow once a release has been created, so the build
# runs in the same run as release-please instead of waiting on a `release`
# event (GITHUB_TOKEN-generated events do not trigger workflows).
# Also dispatchable by hand to rebuild an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri application
        run: npm run tauri build

      - name: Upload installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
